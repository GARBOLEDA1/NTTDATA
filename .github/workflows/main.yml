name: Main Workflow
on: [workflow_dispatch]

jobs:
  build:
    name: Run k6 test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          
      - name: Run k6 tests with Web Dashboard Export
        run: |
          k6 run --out html=load-test-deep.html performance/deeplink.js
        continue-on-error: true

      - name: Upload performance test results (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-html
          path: load-test-deep.html
