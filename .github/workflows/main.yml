name: Main Workflow
on: [workflow_dispatch]
jobs:
  build:
    name: Run k6 test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install k6
        run: |
          curl -sSL https://k6.io/install.sh | sh
          sudo mv k6 /usr/local/bin/
      - name: Run k6 tests with Web Dashboard Export
        env:
          K6_WEB_DASHBOARD_EXPORT: "dashboard.json"  # Define la ruta donde se guardará el archivo JSON del dashboard
        run: |
          k6 run --out json=${K6_WEB_DASHBOARD_EXPORT} performance/deeplink.js
      - name: Convert JSON to HTML
        run: |
          k6 report --json dashboard.json --output dashboard.html
      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-html
          path: dashboard.html
      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-json
          path: dashboard.json
