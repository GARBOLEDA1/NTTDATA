name: Main Workflow
on: [workflow_dispatch]
jobs:
  build:
    name: Run k6 test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run k6 local test
        uses: InnovacionTecnologicaCSP/qa-k6-action@main
        with:
          filename: performance/deeplink.js
      - name: Upload performance test results
        uses: actions/upload-artifact@v4
        with:
          name: k6-report
          path: load-test-scriptBase.html
