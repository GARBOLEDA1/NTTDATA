name: Main Workflow
on: [workflow_dispatch]

jobs:
  build:
    name: Run k6 test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Install k6
        run: |
          sudo apt-get update
          sudo apt-get install -y gnupg2
          curl -s https://dl.k6.io/key.gpg | sudo apt-key add -
          echo "deb https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6
          
      - name: Run k6 tests with Web Dashboard Export
        env:
          K6_WEB_DASHBOARD_EXPORT: "dashboard.json"
        run: |
          k6 run --out json=${K6_WEB_DASHBOARD_EXPORT} performance/deeplink.js
        continue-on-error: true

      - name: Convert JSON to HTML
        run: |
          sudo apt-get install -y jq # Ensure jq is installed for processing JSON
          if k6 report --help | grep -q 'Usage:'; then
            k6 report --json dashboard.json --output dashboard.html
          else
            echo "k6 report command not available in this version of k6"
            exit 1
          fi

      - name: Upload performance test results (HTML)
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-html
          path: dashboard.html

      - name: Upload performance test results (JSON)
        uses: actions/upload-artifact@v4
        with:
          name: k6-report-json
          path: dashboard.json
