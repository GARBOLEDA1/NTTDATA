name: Main Workflow
on: [workflow_dispatch]
jobs:
  build:
    name: Run k6 test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run k6 local test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: performance/scriptBase.js
        env:
          K6_WEB_DASHBOARD: true
          K6_WEB_DASHBOARD_EXPORT: reports\load-test-servicio.html
      - uses: actions/upload-artifact@v4
        with:
          name: my-artifact
          path: reports\load-test-servicio.html
